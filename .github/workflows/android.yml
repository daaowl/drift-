name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Room schema exported
        run: test -f app/schemas/app.sukoon.data.local.SukoonDatabase/1.json
      - uses: actions/upload-artifact@v4
        with:
          name: sukoon-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
      - name: Rename APK
        if: github.ref == 'refs/heads/sukoon'
        run: cp app/build/outputs/apk/debug/*.apk Sukoon-debug.apk
      - name: Publish APK as a release (direct download link)
        if: github.ref == 'refs/heads/sukoon'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sukoon-latest
          name: Sukoon (latest debug build)
          target_commitish: sukoon
          prerelease: true
          make_latest: false
          files: Sukoon-debug.apk
